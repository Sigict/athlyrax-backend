name: Temporary wire Stripe webhook audit

on:
  push:
    branches:
      - hardening/stripe-webhook-signature-required

permissions:
  contents: write

jobs:
  update-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/stripe-webhook-signature-required
      - name: Update production transform auditor
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'scripts/audit-production-transform-chain.mjs';
          let s = fs.readFileSync(p, 'utf8');
          const replacements = [
            [
              "  'scripts/patch-runtime-auth-billing-safety.mjs',\n  'scripts/patch-runtime-identity-event-safety.mjs',",
              "  'scripts/patch-runtime-auth-billing-safety.mjs',\n  'scripts/patch-stripe-webhook-signature.mjs',\n  'scripts/patch-runtime-identity-event-safety.mjs',"
            ],
            [
              "'ATHLYRAX_INVITE_GLOBAL_OWNER_FORBIDDEN','ATHLYRAX_PASSWORD_MINIMUM_12',",
              "'ATHLYRAX_INVITE_GLOBAL_OWNER_FORBIDDEN','ATHLYRAX_PASSWORD_MINIMUM_12','ATHLYRAX_STRIPE_WEBHOOK_SIGNATURE_REQUIRED',"
            ],
            [
              "const clientIpPatch = read('scripts/patch-client-ip-integrity.mjs');",
              "const stripeWebhookPatch = read('scripts/patch-stripe-webhook-signature.mjs');\nfor (const token of ['ATHLYRAX_STRIPE_WEBHOOK_SIGNATURE_REQUIRED',\"if (!signature) {\",'Stripe webhook signature is required.','Stripe webhook verification is not configured.','Unsigned Stripe webhook fallback remains']) {\n  if (!stripeWebhookPatch.includes(token)) failures.push(`scripts/patch-stripe-webhook-signature.mjs: missing ${token}`);\n}\nif (transformedIndex.includes('if (BILLING_STRIPE_WEBHOOK_SECRET && signature) {')) failures.push('index.js: unsigned Stripe webhook fallback remains.');\n\nconst clientIpPatch = read('scripts/patch-client-ip-integrity.mjs');"
            ]
          ];
          for (const [a,b] of replacements) {
            if (!s.includes(a)) throw new Error(`audit anchor missing: ${a}`);
            s = s.replace(a,b);
          }
          fs.writeFileSync(p, s);
          NODE
      - name: Commit auditor update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-production-transform-chain.mjs
          git commit -m "audit Stripe webhook signature transform"
          git push origin HEAD:hardening/stripe-webhook-signature-required
