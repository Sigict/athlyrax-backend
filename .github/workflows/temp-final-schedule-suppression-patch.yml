name: Temporary backend final Schedule patch

on:
  push:
    branches:
      - fix/schedule-deletion-final
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ (github.head_ref == 'fix/schedule-deletion-final' || github.ref == 'refs/heads/fix/schedule-deletion-final') && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/schedule-deletion-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore exact main server source
        run: git checkout origin/main -- index.js
      - name: Apply exact semantic Schedule patch
        run: node scripts/_patch_schedule_suppression_final.mjs
      - name: Restore repository CRLF line endings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.js')
          text = p.read_text(encoding='utf-8').replace('\r\n', '\n').replace('\r', '\n')
          p.write_bytes(text.replace('\n', '\r\n').encode('utf-8'))
          PY
      - name: Commit repaired server source
        run: |
          if git diff --quiet -- index.js; then
            echo "No server source patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "Protect legacy Schedule occurrence deletions server-side"
          git push origin HEAD:fix/schedule-deletion-final
