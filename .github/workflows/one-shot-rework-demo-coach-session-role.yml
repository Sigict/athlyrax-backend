name: One-shot rework demo coach session role

on:
  push:
    branches:
      - fix/demo-coach-canonical-role

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/demo-coach-canonical-role
          fetch-depth: 0
      - name: Apply read-only session-role repair
        run: node .ci/rework-demo-role.mjs
      - name: Commit candidate before production build verification
        run: |
          rm .github/workflows/one-shot-rework-demo-coach-session-role.yml
          rm .ci/rework-demo-role.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(auth): restore demo coach authority in login session'
      - name: Verify production build pipeline and role contract
        run: |
          npm ci
          node --test tests/demo-coach-canonical-role.test.mjs
      - name: Push verified repair
        run: git push origin HEAD:fix/demo-coach-canonical-role
