name: Temporary repair Schedule fail-closed diff

on:
  push:
    branches:
      - fix/schedule-deletion-fail-closed

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/schedule-deletion-fail-closed
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore exact main index.js before small semantic patch
        run: |
          git fetch origin main
          git checkout origin/main -- index.js
      - name: Apply Schedule fix preserving main line endings
        run: node scripts/_repair_schedule_fail_closed_diff.mjs
      - name: Remove temporary repair machinery
        run: |
          rm -f scripts/_repair_schedule_fail_closed_diff.mjs
          rm -f .github/workflows/temp-repair-schedule-fail-closed-diff.yml
      - name: Commit repaired small diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js scripts/_repair_schedule_fail_closed_diff.mjs .github/workflows/temp-repair-schedule-fail-closed-diff.yml
          git commit -m "Repair backend Schedule fix without line-ending churn"
          git push origin HEAD:fix/schedule-deletion-fail-closed
