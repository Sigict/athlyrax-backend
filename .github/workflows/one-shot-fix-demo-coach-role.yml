name: One-shot fix demo coach role

on:
  push:
    branches:
      - fix/demo-coach-canonical-role

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/demo-coach-canonical-role
          fetch-depth: 0
      - name: Canonicalize demo coach role during login repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.js')
          s = p.read_text()
          old = """\tconst canonicalTenantId = CANONICAL_TENANT_BY_USERNAME[String(user?.username || '').trim().toLowerCase()];
\tif (canonicalTenantId && normalizeTenantId(user?.tenantId) !== canonicalTenantId) {
\t\tconst userIndex = authUsers.findIndex((row) => String(row?.username || '').trim().toLowerCase() === String(user?.username || '').trim().toLowerCase());
\t\tif (userIndex >= 0) {
\t\t\tauthUsers[userIndex] = {
\t\t\t\t...authUsers[userIndex],
\t\t\t\ttenantId: canonicalTenantId,
\t\t\t};"""
          new = """\tconst canonicalUsername = String(user?.username || '').trim().toLowerCase();
\tconst canonicalTenantId = CANONICAL_TENANT_BY_USERNAME[canonicalUsername];
\tconst canonicalRole = canonicalUsername === 'demo.coach' ? 'head-coach' : '';
\tconst canonicalProfileDrifted = Boolean(canonicalTenantId) && (
\t\tnormalizeTenantId(user?.tenantId) !== canonicalTenantId
\t\t|| (canonicalRole && String(user?.role || '').trim().toLowerCase() !== canonicalRole)
\t);
\tif (canonicalProfileDrifted) {
\t\tconst userIndex = authUsers.findIndex((row) => String(row?.username || '').trim().toLowerCase() === canonicalUsername);
\t\tif (userIndex >= 0) {
\t\t\tauthUsers[userIndex] = {
\t\t\t\t...authUsers[userIndex],
\t\t\t\ttenantId: canonicalTenantId,
\t\t\t\t...(canonicalRole ? { role: canonicalRole } : {}),
\t\t\t};"""
          if old not in s:
              raise SystemExit('canonical tenant login repair block not found exactly')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Add permanent canonical demo-role contract
        shell: bash
        run: |
          cat > tests/demo-coach-canonical-role.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const source = fs.readFileSync('index.js', 'utf8');

          test('demo.coach login repair restores both canonical tenant and coach role', () => {
            assert.match(source, /canonicalUsername === 'demo\.coach' \? 'head-coach' : ''/);
            assert.match(source, /canonicalProfileDrifted = Boolean\(canonicalTenantId\)/);
            assert.match(source, /canonicalRole && String\(user\?\.role \|\| ''\)\.trim\(\)\.toLowerCase\(\) !== canonicalRole/);
            assert.match(source, /\.\.\.\(canonicalRole \? \{ role: canonicalRole \} : \{\}\)/);
          });
          EOF
      - name: Verify backend contracts
        run: |
          node --check index.js
          node --test tests/demo-coach-canonical-role.test.mjs
          npm run test:runtime-hardening
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-fix-demo-coach-role.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js tests/demo-coach-canonical-role.test.mjs .github/workflows/one-shot-fix-demo-coach-role.yml
          git commit -m 'fix(auth): restore canonical demo coach role on login'
          git push origin HEAD:fix/demo-coach-canonical-role
