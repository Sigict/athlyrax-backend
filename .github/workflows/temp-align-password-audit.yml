name: Temporary align password audit

on:
  push:
    branches:
      - hardening/password-minimum-12

permissions:
  contents: write

jobs:
  update-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/password-minimum-12
      - name: Update password policy audit
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'scripts/audit-production-transform-chain.mjs';
          let s = fs.readFileSync(p, 'utf8');
          const pairs = [
            ['ATHLYRAX_PASSWORD_MINIMUM_12','ATHLYRAX_PASSWORD_MINIMUM_10'],
            ['if (password.length < 12) {','if (password.length < 10) {'],
            ['if (nextPassword.length < 12) {','if (nextPassword.length < 10) {'],
            ['Password must be at least 12 characters.','Password must be at least 10 characters.'],
            ['production password minimum is not consistently 12 characters.','production password minimum is not consistently 10 characters.']
          ];
          for (const [a,b] of pairs) {
            if (!s.includes(a)) throw new Error(`audit anchor missing: ${a}`);
            s = s.replaceAll(a,b);
          }
          fs.writeFileSync(p, s);
          NODE
      - name: Commit audit alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-production-transform-chain.mjs
          git commit -m "align password policy audit to 10 characters"
          git push origin HEAD:hardening/password-minimum-12
