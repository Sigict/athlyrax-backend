name: Temporary final Schedule occurrence server guard patch

on:
  push:
    branches:
      - fix/schedule-occurrence-server-guard

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/schedule-occurrence-server-guard
          fetch-depth: 0
      - name: Apply final server guard patch
        run: node scripts/_patch-final-schedule-occurrence-server-guard.mjs
      - name: Commit final server source
        run: |
          if git diff --quiet -- index.js; then
            echo "No final server patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "Complete server-side Schedule resurrection guard"
          git push origin HEAD:fix/schedule-occurrence-server-guard
