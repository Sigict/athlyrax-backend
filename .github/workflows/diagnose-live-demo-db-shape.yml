name: Diagnose live demo DB shape

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-live-demo-db-shape.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-live-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_URL: https://athlyrax-backend.onrender.com
      DEMO_USERNAME: demo.coach
      DEMO_PASSWORD: DemoCoach123!
    steps:
      - name: Read live planning structure only
        run: |
          set -euo pipefail
          jar="$(mktemp)"
          login="$(mktemp)"
          dbfile="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "${jar}" "${login}" "${dbfile}" "${headers}"' EXIT

          login_code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 30 \
            --cookie-jar "${jar}" --header 'Content-Type: application/json' \
            --data "{\"username\":\"${DEMO_USERNAME}\",\"password\":\"${DEMO_PASSWORD}\"}" \
            --output "${login}" --write-out '%{http_code}' "${BACKEND_URL}/auth/login")"
          test "${login_code}" = "200"

          curl --fail --silent --show-error --location --cookie "${jar}" \
            --dump-header "${headers}" --output "${dbfile}" \
            "${BACKEND_URL}/db?diagnostic=shape&cb=$(date +%s%N)"

          node --input-type=module - "${dbfile}" "${headers}" <<'NODE'
          import fs from 'node:fs';
          const [dbPath, headersPath] = process.argv.slice(2);
          const db = JSON.parse(fs.readFileSync(dbPath, 'utf8'));
          const headers = fs.readFileSync(headersPath, 'utf8');
          const arr = (key) => Array.isArray(db?.[key]) ? db[key] : [];
          const text = (value) => String(value ?? '').trim();
          const ids = (row) => Array.from(new Set([...(Array.isArray(row?.squadIds) ? row.squadIds : []), row?.squadId].map(text).filter(Boolean))).sort();
          const day = (row) => text(row?.dayLabel || row?.day || row?.weekday || row?.weekdayNum || row?.weekdayNumber || row?.dayNumber);
          const sessionShaped = (row) => Boolean(row && typeof row === 'object' && day(row) && text(row?.startTime) && text(row?.endTime) && ids(row).length > 0);
          const slotKey = (row) => [day(row).toLowerCase(), text(row?.startTime), text(row?.endTime), ids(row).join(','), text(row?.venueId).toLowerCase(), text(row?.sessionTypeId || row?.type).toLowerCase()].join('|');
          const idSet = (rows) => new Set(rows.map((row) => text(row?.id)).filter(Boolean));
          const overlapCount = (left, right) => {
            const rhs = idSet(right);
            return [...idSet(left)].filter((id) => rhs.has(id)).length;
          };
          const timetables = arr('timetables');
          const timetable = arr('timetable');
          const timetableSlots = arr('timetableSlots');
          const embedded = timetables.filter(sessionShaped);
          const legacy = timetable.filter(sessionShaped);
          const unionKeys = new Set([...embedded, ...legacy].map(slotKey));
          const embeddedKeys = new Set(embedded.map(slotKey));
          const legacyKeys = new Set(legacy.map(slotKey));
          const keyOverlap = [...legacyKeys].filter((key) => embeddedKeys.has(key)).length;
          const schedule = arr('schedule');
          const trainingSchedules = arr('trainingSchedules');
          const trainingSessions = arr('trainingSessions');
          const report = {
            tenantId: text(db?.__meta?.tenantId),
            storageRevision: db?.__meta?.storageRevision ?? null,
            timetableSlotsLegacyMigrationVersion: db?.__meta?.timetableSlotsLegacyMigrationVersion ?? null,
            counts: {
              timetable: timetable.length,
              timetables: timetables.length,
              timetableSlots: timetableSlots.length,
              schedule: schedule.length,
              trainingSchedules: trainingSchedules.length,
              trainingSessions: trainingSessions.length,
              trainingSessionSets: arr('trainingSessionSets').length,
              attendance: arr('attendance').length,
              fixtures: arr('fixtures').length,
            },
            timetableShape: {
              sessionShapedInTimetables: embedded.length,
              headerShapedInTimetables: timetables.filter((row) => !sessionShaped(row)).length,
              sessionShapedInLegacyTimetable: legacy.length,
              sessionShapedInTimetableSlots: timetableSlots.filter(sessionShaped).length,
              uniqueEmbeddedSessionKeys: embeddedKeys.size,
              uniqueLegacySessionKeys: legacyKeys.size,
              overlappingLegacyEmbeddedKeys: keyOverlap,
              uniqueUnionSessionKeys: unionKeys.size,
            },
            identityOverlap: {
              scheduleVsTrainingSchedules: overlapCount(schedule, trainingSchedules),
              scheduleVsTrainingSessions: overlapCount(schedule, trainingSessions),
              trainingSchedulesVsTrainingSessions: overlapCount(trainingSchedules, trainingSessions),
            },
            responseHeaders: {
              revision: (headers.match(/^X-AthlyraX-DB-Revision:\s*([^\r\n]+)/im) || [])[1] || null,
              backendCommit: (headers.match(/^X-AthlyraX-Backend-Commit:\s*([^\r\n]+)/im) || [])[1] || null,
              persistenceGuard: (headers.match(/^X-AthlyraX-DB-Persistence-Guard:\s*([^\r\n]+)/im) || [])[1] || null,
            },
          };
          console.log('LIVE_DEMO_DB_SHAPE=' + JSON.stringify(report));
          NODE