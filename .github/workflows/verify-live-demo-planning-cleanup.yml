name: Verify live demo planning cleanup

on:
  push:
    branches:
      - diagnostic/live-demo-planning-cleanup-verify

permissions:
  contents: read

jobs:
  verify-live-demo-planning-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_URL: https://athlyrax-backend.onrender.com
      DEMO_USERNAME: demo.coach
      DEMO_PASSWORD: DemoCoach123!
    steps:
      - name: Inspect live demo DB differences
        run: |
          set -euo pipefail
          jar="$(mktemp)"; login="$(mktemp)"; dbfile="$(mktemp)"; headers="$(mktemp)"
          trap 'rm -f "${jar}" "${login}" "${dbfile}" "${headers}"' EXIT
          login_code="$(curl --silent --show-error --location --cookie-jar "${jar}" --header 'Content-Type: application/json' --data "{\"username\":\"${DEMO_USERNAME}\",\"password\":\"${DEMO_PASSWORD}\"}" --output "${login}" --write-out '%{http_code}' "${BACKEND_URL}/auth/login")"
          test "${login_code}" = "200"
          curl --fail --silent --show-error --location --cookie "${jar}" --dump-header "${headers}" --output "${dbfile}" "${BACKEND_URL}/db?cleanup_inspect=$(date +%s%N)"
          node --input-type=module - "${dbfile}" <<'NODE'
          import fs from 'node:fs';
          const db = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const arr = (v) => Array.isArray(v) ? v : [];
          const text = (v) => String(v ?? '').trim();
          const canon = (v) => Array.isArray(v) ? v.map(canon) : (v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map(k => [k, canon(v[k])])) : v);
          const eq = (a,b) => JSON.stringify(canon(a)) === JSON.stringify(canon(b));
          const schedule = arr(db.schedule);
          const legacy = arr(db.trainingSchedules);
          const byId = new Map(legacy.map(r => [text(r?.id), r]));
          const diffKeyCounts = new Map();
          let strippedMismatch = 0;
          const ignore = new Set(['createdAt','updatedAt','createdByUserId','updatedByUserId','tenantId','storageUpdatedAt','attributionStatus','squadNames']);
          for (const row of schedule) {
            const other = byId.get(text(row?.id));
            if (!other) continue;
            const keys = new Set([...Object.keys(row||{}), ...Object.keys(other||{})]);
            for (const key of keys) if (!eq(row?.[key], other?.[key])) diffKeyCounts.set(key, (diffKeyCounts.get(key)||0)+1);
            const strip = (r) => Object.fromEntries(Object.entries(r||{}).filter(([k]) => !ignore.has(k)));
            if (!eq(strip(row), strip(other))) strippedMismatch += 1;
          }
          const tableRows = arr(db.timetables);
          const sessionRows = tableRows.filter((r) => Number.isInteger(Number(r?.weekdayNum)) && text(r?.startTime) && text(r?.endTime) && arr(r?.squadIds).length > 0);
          const headers = tableRows.filter((r) => !(Number.isInteger(Number(r?.weekdayNum)) && text(r?.startTime) && text(r?.endTime) && arr(r?.squadIds).length > 0));
          console.log(JSON.stringify({
            storageRevision: Number(db?.__meta?.storageRevision || 0),
            cleanupAt: text(db?.__meta?.demoPlanningStorageCleanupAt),
            schedule: schedule.length,
            trainingSchedules: legacy.length,
            diffKeyCounts: Object.fromEntries([...diffKeyCounts.entries()].sort((a,b)=>b[1]-a[1])),
            mismatchAfterIgnoringApprovedFields: strippedMismatch,
            timetable: arr(db.timetable).length,
            timetablesSessionRows: sessionRows.length,
            timetablesHeaders: headers.length,
            timetableSlots: arr(db.timetableSlots).length,
            timetableMigrationVersion: Number(db?.__meta?.timetableSlotsLegacyMigrationVersion || 0),
          }, null, 2));
          if (legacy.length !== 0) throw new Error(`trainingSchedules still contains ${legacy.length} rows.`);
          if (!text(db?.__meta?.demoPlanningStorageCleanupAt)) throw new Error('Demo planning cleanup timestamp is missing.');
          console.log('LIVE_TRAINING_SCHEDULE_MIRROR_CLEANUP_OK');
          NODE
