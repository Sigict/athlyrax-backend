name: Temporary validate backend hardening stack

on:
  push:
    branches:
      - hardening/production-auth-token-redaction

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/production-auth-token-redaction
      - name: Install and build transformed backend
        run: npm ci
      - name: Run complete backend safety suite
        run: npm run test:storage-all
      - name: Verify dependency audit
        run: npm audit --audit-level=low
