name: Apply storage temp cleanup fix v2

on:
  push:
    branches:
      - fix/storage-temp-leak-and-preprune

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/storage-temp-leak-and-preprune
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply corrected storage cleanup
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          let index = fs.readFileSync('index.js','utf8').replace(/\r\n/g,'\n');
          const oldAtomic = `function writeAtomicJsonFile(filePath, data) {\n\tconst dir = path.dirname(filePath);\n\tfs.mkdirSync(dir, { recursive: true });\n\tconst tmpPath = path.join(\n\t\tdir,\n\t\t\`${'${'}path.basename(filePath)}.${'${'}process.pid}.${'${'}Date.now()}.tmp\`\n\t);\n\tconst serialized = \`${'${'}JSON.stringify(data, null, 2)}\\n\`;\n\tfs.writeFileSync(tmpPath, serialized, 'utf8');\n\tfs.renameSync(tmpPath, filePath);\n}`;
          const newAtomic = `function cleanupStaleAtomicTemps(filePath) {\n\tconst dir = path.dirname(filePath);\n\tconst prefix = \`${'${'}path.basename(filePath)}.\`;\n\ttry {\n\t\tfor (const entry of fs.readdirSync(dir, { withFileTypes: true })) {\n\t\t\tif (!entry.isFile() || !entry.name.startsWith(prefix) || !entry.name.endsWith('.tmp')) continue;\n\t\t\ttry { fs.unlinkSync(path.join(dir, entry.name)); } catch {}\n\t\t}\n\t} catch {}\n}\n\nfunction writeAtomicJsonFile(filePath, data) {\n\tconst dir = path.dirname(filePath);\n\tfs.mkdirSync(dir, { recursive: true });\n\tcleanupStaleAtomicTemps(filePath);\n\tconst tmpPath = path.join(\n\t\tdir,\n\t\t\`${'${'}path.basename(filePath)}.${'${'}process.pid}.${'${'}Date.now()}.tmp\`\n\t);\n\tconst serialized = \`${'${'}JSON.stringify(data, null, 2)}\\n\`;\n\ttry {\n\t\tfs.writeFileSync(tmpPath, serialized, 'utf8');\n\t\tfs.renameSync(tmpPath, filePath);\n\t} catch (error) {\n\t\ttry { fs.unlinkSync(tmpPath); } catch {}\n\t\tthrow error;\n\t}\n}`;
          if (!index.includes(oldAtomic)) throw new Error('atomic writer anchor missing');
          fs.writeFileSync('index.js', index.replace(oldAtomic,newAtomic));

          let safety = fs.readFileSync('scripts/data-safety-preload.mjs','utf8').replace(/\r\n/g,'\n');
          const isDbAnchor = `function isDatabasePath(value) {\n  const resolved = resolveFilePath(value);\n  return Boolean(resolved) && path.basename(resolved).toLowerCase() === 'db.json';\n}`;
          const isDbReplacement = `${isDbAnchor}\nfunction isAtomicDbTempSource(source, destination) {\n  const sourcePath = resolveFilePath(source);\n  const destinationPath = resolveFilePath(destination);\n  if (path.dirname(sourcePath) !== path.dirname(destinationPath)) return false;\n  const sourceName = path.basename(sourcePath);\n  const destinationName = path.basename(destinationPath);\n  return sourceName.startsWith(\`${'${'}destinationName}.\`) && sourceName.endsWith('.tmp');\n}`;
          if (!safety.includes(isDbAnchor)) throw new Error('database helper anchor missing');
          safety = safety.replace(isDbAnchor,isDbReplacement);

          const backupAnchor = `function backupFileAtRoot(filePath, reason, root, maxFiles, fsModule = fs) {\n  const directory = path.join(root, reason, scopeToken(filePath));\n  fsModule.mkdirSync(directory, { recursive: true });\n  const stamp = new Date().toISOString().replace(/[:.]/g, '-');`;
          const backupReplacement = `function backupFileAtRoot(filePath, reason, root, maxFiles, fsModule = fs) {\n  const directory = path.join(root, reason, scopeToken(filePath));\n  fsModule.mkdirSync(directory, { recursive: true });\n  rotate(directory, Math.max(0, maxFiles - 1), fsModule);\n  const stamp = new Date().toISOString().replace(/[:.]/g, '-');`;
          if (!safety.includes(backupAnchor)) throw new Error('backup anchor missing');
          safety = safety.replace(backupAnchor,backupReplacement);

          const normalStart = `    const context = readContext.getStore();`;
          if (!safety.includes(normalStart)) throw new Error('normal DB guard start missing');
          safety = safety.replace(normalStart,`    try {\n${normalStart}`);

          const normalEnd = `    try { return originalRenameSync(source, destination); }\n    catch (error) {\n      logger.error(\`[data-safety] Database replacement failed for ${'${'}destination}${'${'}backup ? \`; previous version preserved at ${'${'}backup}\` : ''}\`);\n      throw error;\n    }\n  };`;
          const normalEndReplacement = `    try { return originalRenameSync(source, destination); }\n    catch (error) {\n      logger.error(\`[data-safety] Database replacement failed for ${'${'}destination}${'${'}backup ? \`; previous version preserved at ${'${'}backup}\` : ''}\`);\n      throw error;\n    }\n    } catch (error) {\n      if (isAtomicDbTempSource(source, destination)) {\n        try { fsModule.unlinkSync(source); } catch {}\n      }\n      throw error;\n    }\n  };`;
          if (!safety.includes(normalEnd)) throw new Error('normal DB guard end missing');
          safety = safety.replace(normalEnd,normalEndReplacement);
          fs.writeFileSync('scripts/data-safety-preload.mjs',safety);
          NODE
      - name: Add exact regressions
        shell: bash
        run: |
          cat > tests/storage-temp-cleanup-regression.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import test from 'node:test';
          import { installDataSafetyGuards } from '../scripts/data-safety-preload.mjs';
          function tempDir(prefix){ return fs.mkdtempSync(path.join(os.tmpdir(),prefix)); }
          function writeJson(filePath,value){ fs.mkdirSync(path.dirname(filePath),{recursive:true}); fs.writeFileSync(filePath,`${JSON.stringify(value)}\n`,'utf8'); }
          test('any guarded DB rejection deletes only its atomic temp source',{concurrency:false},()=>{
            const root=tempDir('athlyrax-temp-cleanup-');
            const storageRoot=path.join(root,'storage');
            const tenantDir=path.join(storageRoot,'tenants','clubs','demo-company');
            const destination=path.join(tenantDir,'db.json');
            const source=path.join(tenantDir,'db.json.123.456.tmp');
            const unrelated=path.join(tenantDir,'keep.tmp');
            writeJson(destination,{swimmers:[{id:'keep'}],__meta:{tenantId:'demo-company',storageRevision:20}});
            writeJson(source,{swimmers:[{id:'new'}],__meta:{tenantId:'other-company',storageRevision:20}});
            fs.writeFileSync(unrelated,'keep');
            const installation=installDataSafetyGuards({fsModule:fs,env:{NODE_ENV:'production',ATHLYRAX_STORAGE_ROOT:storageRoot},logger:{info(){},error(){}}});
            try{
              assert.throws(()=>fs.renameSync(source,destination));
              assert.equal(fs.existsSync(source),false);
              assert.equal(fs.existsSync(unrelated),true);
              assert.equal(JSON.parse(fs.readFileSync(destination,'utf8')).swimmers[0].id,'keep');
            }finally{ installation.uninstall(); fs.rmSync(root,{recursive:true,force:true}); }
          });
          test('backup retention pre-prunes before repeated protected writes',{concurrency:false},()=>{
            const root=tempDir('athlyrax-backup-preprune-');
            const storageRoot=path.join(root,'storage');
            const tenantDir=path.join(storageRoot,'tenants','clubs','demo-company');
            const destination=path.join(tenantDir,'db.json');
            writeJson(destination,{swimmers:[{id:'old'}],__meta:{tenantId:'demo-company',storageRevision:1}});
            const backupRoot=path.join(root,'backups');
            const installation=installDataSafetyGuards({fsModule:fs,env:{NODE_ENV:'production',ATHLYRAX_STORAGE_ROOT:storageRoot,ATHLYRAX_SAFETY_BACKUP_ROOT:backupRoot,ATHLYRAX_SAFETY_MAX_BACKUPS:'2'},logger:{info(){},error(){}}});
            try{
              for(let i=1;i<=4;i+=1){ const current=JSON.parse(fs.readFileSync(destination,'utf8')); const source=path.join(tenantDir,`db.json.${i}.tmp`); writeJson(source,{...current,swimmers:[{id:`v${i}`}]}); fs.renameSync(source,destination); }
              const preWriteRoot=path.join(backupRoot,'pre-write'); const scope=fs.readdirSync(preWriteRoot)[0]; const files=fs.readdirSync(path.join(preWriteRoot,scope));
              assert.ok(files.length<=2,`expected <=2 backups, found ${files.length}`);
              assert.equal(JSON.parse(fs.readFileSync(destination,'utf8')).swimmers[0].id,'v4');
            }finally{ installation.uninstall(); fs.rmSync(root,{recursive:true,force:true}); }
          });
          EOF
      - name: Run storage regressions
        run: |
          node --test tests/render-storage-write-fallback.test.mjs
          node --test tests/storage-temp-cleanup-regression.test.mjs
      - name: Commit corrected fix
        shell: bash
        run: |
          git config user.name 'Sigict'
          git config user.email 'sergio.catania1@hotmail.com'
          git add index.js scripts/data-safety-preload.mjs tests/storage-temp-cleanup-regression.test.mjs
          git commit -m 'Prevent failed DB writes from exhausting storage'
          git push origin HEAD:fix/storage-temp-leak-and-preprune
