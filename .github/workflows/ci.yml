name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Reject source-controlled runtime storage
        run: node scripts/verify-repository-runtime-storage.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify closed-pilot security source contract
        env:
          NODE_ENV: production
          AUTH_REQUIRED: 'true'
          AUTH_SECRET: ci-commercial-security-secret-at-least-32-chars
          AUTH_ALLOW_COACH_SIGNUP: 'false'
          AUTH_PASSWORD_RESET_DEV_CODE_IN_RESPONSE: 'false'
          AUTH_ALLOW_BEARER_COMPAT: 'false'
          FRONTEND_PUBLIC_ORIGIN: https://athlyrax.example
          ALLOWED_ORIGINS: https://athlyrax.example
        run: |
          export ATHLYRAX_STORAGE_ROOT="$RUNNER_TEMP/athlyrax-storage"
          export ATHLYRAX_SAFETY_BACKUP_ROOT="$RUNNER_TEMP/athlyrax-safety"
          mkdir -p "$ATHLYRAX_STORAGE_ROOT" "$ATHLYRAX_SAFETY_BACKUP_ROOT"
          node verify-closed-pilot-security.mjs
      - name: Guard demo planning cleanup
        run: node --test tests/demo-planning-storage-cleanup.test.mjs
      - name: Verify demo showcase one-time upgrade
        run: node --test tests/demo-showcase-upgrade.test.mjs
      - name: Group Test Results route and separate stroke/cycle storage
        run: node --test tests/group-test-results.test.mjs

      - name: Paid education course access, video and certificate tests
        run: node --test tests/cpd-module02.test.mjs

      - name: Coaching tiers, capacity blocks and Stopwatch entitlement
        run: node --test tests/coaching-billing.test.mjs tests/coaching-billing.integration.test.mjs

      - name: Results inbox (Stopwatch/Assistant/Video results sent to the club)
        run: node --test tests/results-inbox.integration.test.mjs tests/checkout-stale-customer.test.mjs

      - name: Coach Pool Console connection (session load, results per set/rep, lane plan)
        run: node --test tests/coach-poolside-console.integration.test.mjs tests/coach-poolside-projection.test.mjs

      - name: Whole-club save keeps audit metadata of unchanged rows
        run: node --test tests/ownership-metadata-unchanged-rows.integration.test.mjs

      - name: Athlete App invitations link logins to existing swimmers
        run: node --test tests/athlete-account-invites.integration.test.mjs tests/athlete-home-projection.test.mjs

      - name: Athlete App phase 1 (session names, server capability profile, engine copy integrity)
        run: node --test tests/athlete-app-phase1.test.mjs tests/coach-poolside-projection.test.mjs

      - name: Athlete App phase 2 (personal training, offline sync, conflicts)
        run: node --test tests/athlete-personal-training.test.mjs

      - name: Athlete App phase 3A (tests and races, read-only club results)
        run: node --test tests/athlete-tests-races.test.mjs

      - name: Athlete App S2 (fixtures, competition reflections, club fixtures read-only)
        run: node --test tests/athlete-competitions.test.mjs

      - name: Athlete App S3/S4 (development diary, goals, weekly planner)
        run: node --test tests/athlete-development.test.mjs

      - name: Athlete App S5a (Master v31 import, legacy archive, profile)
        run: node --test tests/athlete-import.test.mjs

      - name: Full backend storage and security contract
        run: npm run test:storage-all
