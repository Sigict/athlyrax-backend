name: Apply Render storage fix
on:
  push:
    branches: [fix/render-db-write-backup-fallback-v2]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/patch-render-storage-write-fallback.mjs
      - name: Commit direct source fix
        run: |
          if git diff --quiet -- scripts/data-safety-preload.mjs; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/data-safety-preload.mjs
          git commit -m 'Fix Render database backup fallback path'
          git push
