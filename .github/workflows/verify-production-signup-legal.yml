name: Verify production signup legal enforcement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Install, patch production entrypoint and run safety tests
        run: |
          npm ci
          grep -F "installSignupLegalAcceptanceGuard(express);" index.js
          grep -F "ATHLYRAX_CANONICAL_STORAGE_RUNTIME_GUARD" index.js
          grep -F "ATHLYRAX_FAIL_CLOSED_MISSING_TENANT_WRITE" index.js
          npm run test:signup-legal-acceptance
          npm run test:storage-all

      - name: Wait for backend deployment and verify rejection
        if: github.event_name != 'pull_request'
        env:
          BACKEND_URL: https://athlyrax-backend.onrender.com
        run: |
          set -euo pipefail
          expected_sha="${GITHUB_SHA}"
          echo "Verifying backend commit ${expected_sha}"

          for attempt in $(seq 1 36); do
            config_file="$(mktemp)"
            body_file="$(mktemp)"

            config_code="$(curl --silent --show-error --location \
              --connect-timeout 15 --max-time 30 \
              --output "${config_file}" --write-out '%{http_code}' \
              "${BACKEND_URL}/auth/config" || true)"

            register_code="$(curl --silent --show-error --location \
              --connect-timeout 15 --max-time 30 \
              --header 'Content-Type: application/json' \
              --data '{"username":"athlyrax-legal-deployment-probe","password":"NoAccountIsCreated123!"}' \
              --output "${body_file}" --write-out '%{http_code}' \
              "${BACKEND_URL}/auth/register" || true)"

            if [[ "${config_code}" == "200" \
              && "${register_code}" == "400" \
              && $(grep -ciE 'Swim club and team name are required|Data Processing Agreement' "${body_file}" || true) -gt 0 ]]; then
              echo "Production signup legal enforcement verified for ${expected_sha}."
              cat "${config_file}"
              cat "${body_file}"
              exit 0
            fi

            echo "Attempt ${attempt}/36: config=${config_code}, register=${register_code}; response=$(cat "${body_file}")"
            rm -f "${config_file}" "${body_file}"
            sleep 15
          done

          echo "Production did not expose the required signup legal guard within the verification window." >&2
          exit 1
