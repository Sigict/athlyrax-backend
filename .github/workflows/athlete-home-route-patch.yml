name: Athlete home route patch

on:
  push:
    branches:
      - feature/athlete-home-api

permissions:
  contents: write

jobs:
  wire-route:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire scoped athlete-home route
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.js')
          s = p.read_text()
          import_line = "import { buildAthleteHomeProjection } from './athlete-home-projection.mjs';\n"
          if import_line not in s:
              marker = "import helmet from 'helmet';\n"
              if marker not in s:
                  raise SystemExit('helmet import marker not found')
              s = s.replace(marker, marker + import_line, 1)
          route = """app.get('/swimmer/athlete-home', requireStrictAuth, requireSwimmerRole, (req, res) => {\n\tconst paths = resolveStoragePathsForRequest(req);\n\tif (paths?.error) {\n\t\tres.status(Number(paths.errorStatus || 403)).json({ error: String(paths.error || 'Tenant scope denied.') });\n\t\treturn;\n\t}\n\tensureStorageLayout(paths);\n\tfs.readFile(paths.dbPath, 'utf8', (err, data) => {\n\t\tif (err) {\n\t\t\tres.status(500).json({ error: 'Could not read athlete data.' });\n\t\t\treturn;\n\t\t}\n\t\ttry {\n\t\t\tconst db = JSON.parse(String(data || '{}'));\n\t\t\tconst authUser = findAuthUser(String(req.auth?.username || '').trim()) || req.auth || {};\n\t\t\tconst projection = buildAthleteHomeProjection(db, authUser);\n\t\t\tif (!projection) {\n\t\t\t\tres.status(404).json({ error: 'Athlete profile not found.' });\n\t\t\t\treturn;\n\t\t\t}\n\t\t\tres.status(200).json({ ok: true, ...projection });\n\t\t} catch (error) {\n\t\t\tres.status(500).json({ error: 'Could not build athlete home.', details: error instanceof Error ? error.message : 'Unknown error' });\n\t\t}\n\t});\n});\n\n"""
          if "app.get('/swimmer/athlete-home'" not in s:
              marker = "// Serve db.json at /db\n"
              if marker not in s:
                  raise SystemExit('/db route marker not found')
              s = s.replace(marker, route + marker, 1)
          p.write_text(s)
          PY
      - name: Verify projection
        run: node --test tests/athlete-home-projection.test.mjs
      - name: Commit route wiring
        run: |
          if git diff --quiet -- index.js; then
            echo 'Route already wired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js
          git commit -m 'Wire scoped athlete-home API [skip ci]'
          git push origin HEAD:feature/athlete-home-api
