name: Diagnose live demo DB shape

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-live-demo-db-shape.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-live-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_URL: https://athlyrax-backend.onrender.com
      DEMO_USERNAME: demo.coach
      DEMO_PASSWORD: DemoCoach123!
    steps:
      - name: Read live planning structure only
        run: |
          set -euo pipefail
          jar="$(mktemp)"
          login="$(mktemp)"
          dbfile="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "${jar}" "${login}" "${dbfile}" "${headers}"' EXIT

          login_code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 30 \
            --cookie-jar "${jar}" --header 'Content-Type: application/json' \
            --data "{\"username\":\"${DEMO_USERNAME}\",\"password\":\"${DEMO_PASSWORD}\"}" \
            --output "${login}" --write-out '%{http_code}' "${BACKEND_URL}/auth/login")"
          test "${login_code}" = "200"

          curl --fail --silent --show-error --location --cookie "${jar}" \
            --dump-header "${headers}" --output "${dbfile}" \
            "${BACKEND_URL}/db?diagnostic=shape&cb=$(date +%s%N)"

          node --input-type=module - "${dbfile}" "${headers}" <<'NODE'
          import fs from 'node:fs';
          const [dbPath, headersPath] = process.argv.slice(2);
          const db = JSON.parse(fs.readFileSync(dbPath, 'utf8'));
          const headers = fs.readFileSync(headersPath, 'utf8');
          const arr = (key) => Array.isArray(db?.[key]) ? db[key] : [];
          const text = (value) => String(value ?? '').trim();
          const ids = (row) => Array.from(new Set([...(Array.isArray(row?.squadIds) ? row.squadIds : []), row?.squadId].map(text).filter(Boolean)));
          const sessionShaped = (row) => Boolean(
            row && typeof row === 'object'
            && (text(row?.dayLabel || row?.day || row?.weekday) || Number.isFinite(Number(row?.weekdayNum ?? row?.weekdayNumber ?? row?.dayNumber)))
            && text(row?.startTime)
            && text(row?.endTime)
            && ids(row).length > 0
          );
          const timetables = arr('timetables');
          const timetable = arr('timetable');
          const timetableSlots = arr('timetableSlots');
          const report = {
            tenantId: text(db?.__meta?.tenantId),
            storageRevision: db?.__meta?.storageRevision ?? null,
            timetableSlotsLegacyMigrationVersion: db?.__meta?.timetableSlotsLegacyMigrationVersion ?? null,
            counts: {
              timetable: timetable.length,
              timetables: timetables.length,
              timetableSlots: timetableSlots.length,
              schedule: arr('schedule').length,
              trainingSchedules: arr('trainingSchedules').length,
              trainingSessions: arr('trainingSessions').length,
              trainingSessionSets: arr('trainingSessionSets').length,
              attendance: arr('attendance').length,
              fixtures: arr('fixtures').length,
            },
            timetableShape: {
              sessionShapedInTimetables: timetables.filter(sessionShaped).length,
              headerShapedInTimetables: timetables.filter((row) => !sessionShaped(row)).length,
              sessionShapedInLegacyTimetable: timetable.filter(sessionShaped).length,
              sessionShapedInTimetableSlots: timetableSlots.filter(sessionShaped).length,
            },
            responseHeaders: {
              revision: (headers.match(/^X-AthlyraX-DB-Revision:\s*([^\r\n]+)/im) || [])[1] || null,
              backendCommit: (headers.match(/^X-AthlyraX-Backend-Commit:\s*([^\r\n]+)/im) || [])[1] || null,
              persistenceGuard: (headers.match(/^X-AthlyraX-DB-Persistence-Guard:\s*([^\r\n]+)/im) || [])[1] || null,
            },
          };
          console.log('LIVE_DEMO_DB_SHAPE=' + JSON.stringify(report));
          NODE