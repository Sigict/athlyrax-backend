name: Temporary wire snapshot cookie audit

on:
  push:
    branches:
      - hardening/snapshot-cookie-session

permissions:
  contents: write

jobs:
  update-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/snapshot-cookie-session
      - name: Update production transform auditor
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'scripts/audit-production-transform-chain.mjs';
          let s = fs.readFileSync(p, 'utf8');
          const replacements = [
            [
              "  'scripts/patch-password-policy.mjs',\n  'scripts/patch-coach-link-suite.mjs',",
              "  'scripts/patch-password-policy.mjs',\n  'scripts/patch-snapshot-cookie-session.mjs',\n  'scripts/patch-coach-link-suite.mjs',"
            ],
            [
              "read('tests/auth-enumeration-safety.test.mjs');\nread('tests/coach-link-transaction.test.mjs');",
              "read('tests/auth-enumeration-safety.test.mjs');\nread('tests/snapshot-cookie-session.test.mjs');\nread('tests/coach-link-transaction.test.mjs');"
            ],
            [
              "'ATHLYRAX_INVITE_GLOBAL_OWNER_FORBIDDEN','ATHLYRAX_PASSWORD_MINIMUM_10','ATHLYRAX_STRIPE_WEBHOOK_SIGNATURE_REQUIRED',",
              "'ATHLYRAX_INVITE_GLOBAL_OWNER_FORBIDDEN','ATHLYRAX_PASSWORD_MINIMUM_10','ATHLYRAX_SNAPSHOT_COOKIE_SESSION_V1','ATHLYRAX_STRIPE_WEBHOOK_SIGNATURE_REQUIRED',"
            ],
            [
              "const clientIpPatch = read('scripts/patch-client-ip-integrity.mjs');",
              "const snapshotCookiePatch = read('scripts/patch-snapshot-cookie-session.mjs');\nfor (const token of ['ATHLYRAX_SNAPSHOT_COOKIE_SESSION_V1','ATHLYRAX_SNAPSHOT_SIGNUP_NO_BEARER_TOKEN','setAuthCookies(res, { token: session.token, csrfToken: session.csrf });','csrfToken: session.csrf','Snapshot auth still exposes bearer token']) {\n  if (!snapshotCookiePatch.includes(token)) failures.push(`scripts/patch-snapshot-cookie-session.mjs: missing ${token}`);\n}\nif (!transformedIndex.includes('ATHLYRAX_SNAPSHOT_COOKIE_SESSION_V1')) failures.push('index.js: snapshot cookie session hardening marker missing.');\n\nconst clientIpPatch = read('scripts/patch-client-ip-integrity.mjs');"
            ],
            [
              "'test:auth-enumeration-safety','test:storage-routing-safety'",
              "'test:auth-enumeration-safety','test:snapshot-cookie-session','test:storage-routing-safety'"
            ]
          ];
          for (const [a,b] of replacements) {
            if (!s.includes(a)) throw new Error(`audit anchor missing: ${a}`);
            s = s.replace(a,b);
          }
          fs.writeFileSync(p, s);
          NODE
      - name: Commit auditor update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-production-transform-chain.mjs
          git commit -m "audit snapshot cookie session transform"
          git push origin HEAD:hardening/snapshot-cookie-session
