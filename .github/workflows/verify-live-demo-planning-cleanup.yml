name: Verify live demo planning cleanup

on:
  push:
    branches:
      - diagnostic/live-demo-planning-cleanup-verify

permissions:
  contents: read

jobs:
  verify-live-demo-planning-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_URL: https://athlyrax-backend.onrender.com
      DEMO_USERNAME: demo.coach
      DEMO_PASSWORD: DemoCoach123!
    steps:
      - name: Verify live demo DB shape
        run: |
          set -euo pipefail
          jar="$(mktemp)"
          login="$(mktemp)"
          dbfile="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "${jar}" "${login}" "${dbfile}" "${headers}"' EXIT

          login_code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 30 \
            --cookie-jar "${jar}" --header 'Content-Type: application/json' \
            --data "{\"username\":\"${DEMO_USERNAME}\",\"password\":\"${DEMO_PASSWORD}\"}" \
            --output "${login}" --write-out '%{http_code}' "${BACKEND_URL}/auth/login")"
          test "${login_code}" = "200"

          curl --fail --silent --show-error --location --cookie "${jar}" \
            --dump-header "${headers}" --output "${dbfile}" "${BACKEND_URL}/db?cleanup_verify=$(date +%s%N)"

          backend_commit="$(awk 'BEGIN{IGNORECASE=1} /^X-AthlyraX-Backend-Commit:/ {gsub(/\r/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "${headers}")"
          revision="$(awk 'BEGIN{IGNORECASE=1} /^X-AthlyraX-DB-Revision:/ {gsub(/\r/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "${headers}")"

          node --input-type=module - "${dbfile}" "${backend_commit}" "${revision}" <<'NODE'
          import fs from 'node:fs';
          const [dbPath, backendCommit, headerRevision] = process.argv.slice(2);
          const db = JSON.parse(fs.readFileSync(dbPath, 'utf8'));
          const asArray = (value) => Array.isArray(value) ? value : [];
          const text = (value) => String(value ?? '').trim();
          const isLegacySessionRow = (row) => {
            if (!row || typeof row !== 'object') return false;
            const day = text(row.dayLabel || row.day || row.weekday);
            const squads = [...asArray(row.squadIds), row.squadId].map(text).filter(Boolean);
            return Boolean(day && text(row.startTime) && text(row.endTime) && squads.length > 0);
          };

          const shape = {
            tenantId: text(db?.__meta?.tenantId),
            storageRevision: Number(db?.__meta?.storageRevision ?? -1),
            headerRevision: Number(headerRevision || -1),
            backendCommit: text(backendCommit),
            schedule: asArray(db.schedule).length,
            trainingSchedules: asArray(db.trainingSchedules).length,
            timetable: asArray(db.timetable).length,
            timetables: asArray(db.timetables).length,
            embeddedLegacyTimetableRows: asArray(db.timetables).filter(isLegacySessionRow).length,
            timetableSlots: asArray(db.timetableSlots).length,
            timetableMigrationVersion: Number(db?.__meta?.timetableSlotsLegacyMigrationVersion || 0),
            cleanupAt: text(db?.__meta?.demoPlanningStorageCleanupAt),
          };
          console.log(JSON.stringify(shape, null, 2));

          if (shape.tenantId !== 'demo-company') throw new Error(`Unexpected tenant ${shape.tenantId}`);
          if (shape.schedule <= 0) throw new Error('Canonical schedule is unexpectedly empty.');
          if (shape.trainingSchedules !== 0) throw new Error(`trainingSchedules still contains ${shape.trainingSchedules} rows.`);
          if (shape.timetable !== 0) throw new Error(`legacy timetable still contains ${shape.timetable} rows.`);
          if (shape.embeddedLegacyTimetableRows !== 0) throw new Error(`timetables still embeds ${shape.embeddedLegacyTimetableRows} legacy session rows.`);
          if (shape.timetableMigrationVersion < 5) throw new Error(`Timetable migration version is ${shape.timetableMigrationVersion}, expected >=5.`);
          if (!shape.cleanupAt) throw new Error('Cleanup completion timestamp is missing.');
          if (shape.headerRevision >= 0 && shape.storageRevision !== shape.headerRevision) throw new Error('DB revision header/body mismatch.');
          console.log('LIVE_DEMO_PLANNING_CLEANUP_OK');
          NODE
