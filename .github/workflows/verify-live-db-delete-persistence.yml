name: Verify live storage boundary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-live-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BACKEND_URL: https://athlyrax-backend.onrender.com
      EXPECTED_GUARD: 2026-08-13-v1
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Verify exact live backend and persistence boundary without writes
        id: verify_storage
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "${headers}" "${body}"' EXIT

          for attempt in $(seq 1 40); do
            : >"${headers}"
            : >"${body}"
            code="$(curl --silent --show-error --location \
              --connect-timeout 15 --max-time 30 \
              --dump-header "${headers}" --output "${body}" --write-out '%{http_code}' \
              "${BACKEND_URL}/db?storage_boundary_probe=${GITHUB_SHA}-${attempt}" || true)"

            guard="$(awk 'BEGIN{IGNORECASE=1} /^X-AthlyraX-DB-Persistence-Guard:/ {gsub(/\r/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "${headers}")"
            backend_commit="$(awk 'BEGIN{IGNORECASE=1} /^X-AthlyraX-Backend-Commit:/ {gsub(/\r/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "${headers}")"

            if [[ "${code}" == "401" && "${guard}" == "${EXPECTED_GUARD}" && "${backend_commit}" == "${GITHUB_SHA}" ]]; then
              grep -qi '^Cache-Control:.*no-store' "${headers}"
              echo "Exact live backend ${backend_commit} exposes persistence guard ${guard}; protected /db is read-only probed and no-store."
              echo 'ATHLYRAX_LIVE_STORAGE_BOUNDARY_OK'
              exit 0
            fi

            echo "Waiting for exact live storage boundary (${attempt}/40): status=${code}, commit=${backend_commit:-missing}, guard=${guard:-missing}"
            sleep 15
          done

          echo "Render did not expose the exact commit and required read-only storage boundary in time." >&2
          exit 1

      - name: Record storage-boundary verification
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 23 --repo "${GITHUB_REPOSITORY}" --body-file - <<EOF
          LIVE_STORAGE_BOUNDARY_RESULT

          Status: ${{ job.status }}
          Commit: ${GITHUB_SHA}
          Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Target: ${BACKEND_URL}
          Mutation performed: no
          EOF
