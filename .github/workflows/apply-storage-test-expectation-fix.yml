name: Apply storage test expectation fix

on:
  push:
    branches:
      - fix/storage-temp-leak-and-preprune

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/storage-temp-leak-and-preprune
      - name: Update rejected-temp expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/data-safety.test.mjs')
          s = p.read_text()
          old = "  assert.equal(fs.existsSync(destination), false);\n  assert.equal(fs.existsSync(source), true);\n  fs.rmSync(root, { recursive: true, force: true });\n});\n\ntest('forged client provisioning metadata cannot recreate a missing production database'"
          new = "  assert.equal(fs.existsSync(destination), false);\n  assert.equal(fs.existsSync(source), false);\n  fs.rmSync(root, { recursive: true, force: true });\n});\n\ntest('forged client provisioning metadata cannot recreate a missing production database'"
          if old not in s:
              raise SystemExit('expected missing-db source-retention assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'Sigict'
          git config user.email 'sergio.catania1@hotmail.com'
          git add tests/data-safety.test.mjs
          git commit -m 'Require rejected atomic DB temp cleanup'
          git push origin HEAD:fix/storage-temp-leak-and-preprune
