name: Verify production signup legal enforcement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Install, patch production entrypoint and run safety tests
        run: |
          npm ci
          grep -F "installSignupLegalAcceptanceGuard(express);" index.js
          grep -F "ATHLYRAX_CANONICAL_STORAGE_RUNTIME_GUARD" index.js
          grep -F "ATHLYRAX_FAIL_CLOSED_MISSING_TENANT_WRITE" index.js
          grep -F "ATHLYRAX_DEMO_RECOVERY_RELEASE_2026_08_08_V1" index.js
          grep -F "PUBLIC_DEMO_CANONICAL_IDENTITY" scripts/patch-public-demo-readonly.mjs
          node --test tests/demo-coach-routing-regression.test.mjs
          npm run test:signup-legal-acceptance
          npm run test:public-demo-readonly
          npm run test:storage-all

      - name: Wait for exact backend release and verify rejection
        id: verify_release
        if: github.event_name != 'pull_request'
        env:
          BACKEND_URL: https://athlyrax-backend.onrender.com
          EXPECTED_RELEASE_MARKER: ATHLYRAX_DEMO_RECOVERY_RELEASE_2026_08_08_V1
        run: |
          set -euo pipefail
          expected_sha="${GITHUB_SHA}"
          echo "Verifying backend commit ${expected_sha}"

          for attempt in $(seq 1 36); do
            config_file="$(mktemp)"
            body_file="$(mktemp)"
            header_file="$(mktemp)"

            config_code="$(curl --silent --show-error --location \
              --connect-timeout 15 --max-time 30 \
              --output "${config_file}" --write-out '%{http_code}' \
              "${BACKEND_URL}/auth/config" || true)"

            release_match="$(node --input-type=module --eval "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(String(p?.releaseMarker||'')===process.argv[2]?'yes':'no');" "${config_file}" "${EXPECTED_RELEASE_MARKER}" 2>/dev/null || printf 'no')"

            db_code="$(curl --silent --show-error --location \
              --connect-timeout 15 --max-time 30 \
              --dump-header "${header_file}" \
              --output "${body_file}" --write-out '%{http_code}' \
              "${BACKEND_URL}/db?commit_probe=${expected_sha}-${attempt}" || true)"
            backend_commit="$(awk 'BEGIN{IGNORECASE=1} /^X-AthlyraX-Backend-Commit:/ {gsub(/\r/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "${header_file}")"

            if [[ "${config_code}" == "200" && "${release_match}" == "yes" && "${db_code}" == "401" && "${backend_commit}" == "${expected_sha}" ]]; then
              register_code="$(curl --silent --show-error --location \
                --connect-timeout 15 --max-time 30 \
                --header 'Content-Type: application/json' \
                --data '{"username":"athlyrax-legal-deployment-probe","password":"NoAccountIsCreated123!"}' \
                --output "${body_file}" --write-out '%{http_code}' \
                "${BACKEND_URL}/auth/register" || true)"
              if [[ "${register_code}" == "400" \
                && $(grep -ciE 'Swim club and team name are required|Data Processing Agreement' "${body_file}" || true) -gt 0 ]]; then
                echo "Exact production backend commit and signup legal enforcement verified for ${expected_sha}."
                rm -f "${config_file}" "${body_file}" "${header_file}"
                exit 0
              fi
            fi

            echo "Attempt ${attempt}/36: config=${config_code}, release=${release_match}, db=${db_code}, commit=${backend_commit:-missing}"
            rm -f "${config_file}" "${body_file}" "${header_file}"
            sleep 15
          done

          echo "Production never exposed the exact backend commit ${expected_sha} with required guards." >&2
          exit 1

      - name: Verify live demo coach canonical access when credential secret is configured
        id: verify_demo
        if: github.event_name != 'pull_request'
        env:
          BACKEND_URL: https://athlyrax-backend.onrender.com
          DEMO_USERNAME: demo.coach
          DEMO_PASSWORD: ${{ secrets.ATHLYRAX_DEMO_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DEMO_PASSWORD:-}" ]; then
            echo 'ATHLYRAX_DEMO_PASSWORD is not configured; exact-release verification remains authoritative and the demo coach boundary is covered by the mandatory integration test.'
            exit 0
          fi

          cookie_jar="$(mktemp)"
          login_body="$(mktemp)"
          me_body="$(mktemp)"
          db_body="$(mktemp)"
          trap 'rm -f "${cookie_jar}" "${login_body}" "${me_body}" "${db_body}"' EXIT

          login_code="$(curl --silent --show-error --location \
            --connect-timeout 15 --max-time 30 \
            --cookie-jar "${cookie_jar}" \
            --header 'Content-Type: application/json' \
            --data "{\"username\":\"${DEMO_USERNAME}\",\"password\":\"${DEMO_PASSWORD}\"}" \
            --output "${login_body}" --write-out '%{http_code}' \
            "${BACKEND_URL}/auth/login" || true)"
          if [[ "${login_code}" != "200" ]]; then
            echo "Live demo login failed with HTTP ${login_code}." >&2
            exit 1
          fi

          me_code="$(curl --silent --show-error --location \
            --connect-timeout 15 --max-time 30 \
            --cookie "${cookie_jar}" \
            --output "${me_body}" --write-out '%{http_code}' \
            "${BACKEND_URL}/auth/me" || true)"
          db_code="$(curl --silent --show-error --location \
            --connect-timeout 15 --max-time 30 \
            --cookie "${cookie_jar}" \
            --output "${db_body}" --write-out '%{http_code}' \
            "${BACKEND_URL}/db" || true)"
          if [[ "${me_code}" != "200" || "${db_code}" != "200" ]]; then
            echo "Live demo fetch failed: auth/me=${me_code}, db=${db_code}." >&2
            exit 1
          fi

          node --input-type=module - "${me_body}" "${db_body}" <<'NODE'
          import fs from 'node:fs';
          const [mePath, dbPath] = process.argv.slice(2);
          const me = JSON.parse(fs.readFileSync(mePath, 'utf8'));
          const db = JSON.parse(fs.readFileSync(dbPath, 'utf8'));
          const username = String(me?.user?.username || '');
          const tenantId = String(me?.user?.tenantId || '');
          const role = String(me?.user?.role || '');
          if (username !== 'demo.coach') throw new Error(`Unexpected live demo username: ${username}`);
          if (tenantId !== 'demo-company') throw new Error(`Live demo tenant mismatch: ${tenantId}`);
          if (role !== 'head-coach') throw new Error(`Live demo coach must keep head-coach authority, got: ${role}`);
          const keys = ['swimmers','squads','trainingSessions','trainingSessionSets','tests','attendance','competitions','fixtures','groups','timetables','timetableSlots'];
          const meaningful = keys.some((key) => Array.isArray(db?.[key]) && db[key].length > 0);
          if (!meaningful) throw new Error('Live demo coach database contains no meaningful synthetic records.');
          NODE

      - name: Record production verification result
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 23 --repo "${GITHUB_REPOSITORY}" --body-file - <<EOF
          PRODUCTION_VERIFICATION_RESULT

          Status: ${{ job.status }}
          Commit: ${GITHUB_SHA}
          Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Exact release verification: ${{ steps.verify_release.outcome }}
          Optional live demo verification: ${{ steps.verify_demo.outcome }}
          Target: https://athlyrax-backend.onrender.com
          EOF
