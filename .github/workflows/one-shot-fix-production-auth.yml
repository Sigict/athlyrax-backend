name: One-shot fix production auth

on:
  push:
    branches:
      - fix/production-logout-and-demo-role

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-logout-and-demo-role
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch production auth session authority and logout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          index_path = Path('index.js')
          source = index_path.read_text()

          anchor = "function buildAuthUserPayload(user) {\n\tconst normalizedUser = user && typeof user === 'object' ? user : {};"
          replacement = "function resolveEffectiveAuthRole(user) {\n\tconst username = String(user?.username || '').trim().toLowerCase();\n\tif (username === 'demo.coach') return 'head-coach';\n\treturn String(user?.role || 'viewer').trim() || 'viewer';\n}\n\nfunction buildAuthUserPayload(user) {\n\tconst normalizedUser = user && typeof user === 'object' ? user : {};"
          if anchor not in source:
              raise SystemExit('buildAuthUserPayload anchor missing')
          source = source.replace(anchor, replacement, 1)

          old = "\t\trole: String(normalizedUser?.role || 'viewer').trim() || 'viewer',"
          new = "\t\trole: resolveEffectiveAuthRole(normalizedUser),"
          if source.count(old) < 1:
              raise SystemExit('buildAuthUserPayload role anchor missing')
          source = source.replace(old, new, 1)

          old = "\t\t\trole: String(user.role || 'viewer'),\n\t\t\tcsrf: String(payload.csrf),"
          new = "\t\t\trole: resolveEffectiveAuthRole(user),\n\t\t\tcsrf: String(payload.csrf),"
          if old not in source:
              raise SystemExit('verifyAuthToken role anchor missing')
          source = source.replace(old, new, 1)

          old = "\tif (method === 'GET' || method === 'HEAD' || method === 'OPTIONS') return next();\n\tif (!req.auth) return next();"
          new = "\tif (method === 'GET' || method === 'HEAD' || method === 'OPTIONS') return next();\n\t// Logout is deliberately CSRF-exempt: forcing a user to sign out is not a privileged mutation,\n\t// and the endpoint still requires a valid authenticated session before clearing its cookies.\n\tif (method === 'POST' && String(req.path || '') === '/auth/logout') return next();\n\tif (!req.auth) return next();"
          if old not in source:
              raise SystemExit('requireCsrf anchor missing')
          source = source.replace(old, new, 1)

          old = """app.post('/auth/logout', requireStrictAuth, (req, res) => {
\tconst username = String(req.auth?.username || '').trim();
\tconst index = authUsers.findIndex((row) => String(row?.username || '').trim() === username);
\tif (index < 0) {
\t\tres.status(401).json({ error: 'Authentication required.' });
\t\treturn;
\t}

\tconst previous = authUsers[index];
\tauthUsers[index] = {
\t\t...previous,
\t\ttokenValidAfter: getNowEpochSeconds() + 1,
\t};

\ttry {
\t\tpersistAuthUsers();
\t\tclearAuthCookies(res);
\t\tappendAuthAuditEvent({
\t\t\taction: 'logout',
\t\t\treq,
\t\t\tstatus: 'success',
\t\t\ttarget: username,
\t\t});
\t\tres.status(200).json({ ok: true });
\t} catch (error) {
\t\tauthUsers[index] = previous;
\t\tres.status(500).json({
\t\t\terror: 'Could not complete logout.',
\t\t\tdetails: error instanceof Error ? error.message : 'Unknown error',
\t\t});
\t}
});"""
          new = """app.post('/auth/logout', requireStrictAuth, (req, res) => {
\tconst username = String(req.auth?.username || '').trim();
\tconst index = authUsers.findIndex((row) => String(row?.username || '').trim() === username);
\tif (index < 0) {
\t\tclearAuthCookies(res);
\t\tres.status(200).json({ ok: true, alreadySignedOut: true });
\t\treturn;
\t}

\t// Revoke the current account's existing tokens immediately in memory. Persistence is
\t// best-effort: a read-only/degraded auth store must never trap a user inside a session.
\tauthUsers[index] = {
\t\t...authUsers[index],
\t\ttokenValidAfter: getNowEpochSeconds() + 1,
\t};
\tlet revocationPersisted = true;
\ttry {
\t\tpersistAuthUsers();
\t} catch {
\t\trevocationPersisted = false;
\t}

\tclearAuthCookies(res);
\tauthPresenceByUser.delete(username);
\tappendAuthAuditEvent({
\t\taction: 'logout',
\t\treq,
\t\tstatus: 'success',
\t\ttarget: username,
\t\tdetails: { revocationPersisted },
\t});
\tres.status(200).json({ ok: true, revocationPersisted });
});"""
          if old not in source:
              raise SystemExit('logout route anchor missing')
          source = source.replace(old, new, 1)
          index_path.write_text(source)

          test_path = Path('tests/production-auth-session-regression.test.mjs')
          test_path.write_text(r'''import test from 'node:test';
import assert from 'node:assert/strict';
import fs from 'node:fs';
import os from 'node:os';
import path from 'node:path';
import net from 'node:net';
import { spawn } from 'node:child_process';

function getFreePort() {
  return new Promise((resolve, reject) => {
    const server = net.createServer();
    server.on('error', reject);
    server.listen(0, '127.0.0.1', () => {
      const address = server.address();
      const port = typeof address === 'object' && address ? address.port : 0;
      server.close(() => resolve(port));
    });
  });
}

async function waitForServer(url, child) {
  const deadline = Date.now() + 15000;
  while (Date.now() < deadline) {
    if (child.exitCode !== null) throw new Error(`backend exited early: ${child.exitCode}`);
    try {
      const response = await fetch(`${url}/auth/config`);
      if (response.ok) return;
    } catch {}
    await new Promise((resolve) => setTimeout(resolve, 100));
  }
  throw new Error('backend did not become ready');
}

function cookieHeaderFrom(response) {
  const raw = response.headers.get('set-cookie') || '';
  const session = raw.match(/athlyrax_session=([^;,]+)/)?.[1] || '';
  const csrf = raw.match(/athlyrax_csrf=([^;,]+)/)?.[1] || '';
  assert.ok(session, 'login must set session cookie');
  assert.ok(csrf, 'login must set csrf cookie');
  return `athlyrax_session=${session}; athlyrax_csrf=${csrf}`;
}

test('demo coach authority survives token verification and logout cannot trap the browser', async (t) => {
  const storageRoot = fs.mkdtempSync(path.join(os.tmpdir(), 'athlyrax-auth-session-'));
  const port = await getFreePort();
  const baseUrl = `http://127.0.0.1:${port}`;
  const child = spawn(process.execPath, ['index.js'], {
    cwd: process.cwd(),
    env: {
      ...process.env,
      PORT: String(port),
      NODE_ENV: 'production',
      ATHLYRAX_STORAGE_ROOT: storageRoot,
      AUTH_SECRET: 'production-auth-session-regression-secret',
      AUTH_ENABLE_DEMO_SEED_USERS: 'false',
    },
    stdio: ['ignore', 'pipe', 'pipe'],
  });
  t.after(() => {
    child.kill('SIGTERM');
    fs.rmSync(storageRoot, { recursive: true, force: true });
  });
  await waitForServer(baseUrl, child);

  const login = await fetch(`${baseUrl}/auth/login`, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ username: 'demo.coach', password: 'DemoCoach123!' }),
  });
  assert.equal(login.status, 200);
  const loginBody = await login.json();
  assert.equal(loginBody?.user?.role, 'head-coach');
  const cookie = cookieHeaderFrom(login);

  const me = await fetch(`${baseUrl}/auth/me`, { headers: { cookie } });
  assert.equal(me.status, 200);
  const meBody = await me.json();
  assert.equal(meBody?.user?.role, 'head-coach', 'verified session must not collapse demo.coach back to viewer');

  const logout = await fetch(`${baseUrl}/auth/logout`, {
    method: 'POST',
    headers: { cookie },
  });
  assert.equal(logout.status, 200, 'logout must work without CSRF state');
  const logoutSetCookie = logout.headers.get('set-cookie') || '';
  assert.match(logoutSetCookie, /athlyrax_session=.*Max-Age=0/i);
  assert.match(logoutSetCookie, /athlyrax_csrf=.*Max-Age=0/i);

  const staleSession = await fetch(`${baseUrl}/auth/me`, { headers: { cookie } });
  assert.equal(staleSession.status, 401, 'old session must be revoked in the running backend after logout');
});
''')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          scripts = package.setdefault('scripts', {})
          scripts['test:production-auth-session'] = 'node --test tests/production-auth-session-regression.test.mjs'
          storage_all = scripts['test:storage-all']
          marker = ' && npm run test:auth-enumeration-safety'
          if 'test:production-auth-session' not in storage_all:
              if marker not in storage_all:
                  raise SystemExit('package test:storage-all anchor missing')
              storage_all = storage_all.replace(marker, marker + ' && npm run test:production-auth-session', 1)
          scripts['test:storage-all'] = storage_all
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          PY

          npm ci
          npm run test:production-auth-session
          npm run test:storage-all

          rm .github/workflows/one-shot-fix-production-auth.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.js package.json tests/production-auth-session-regression.test.mjs .github/workflows/one-shot-fix-production-auth.yml
          git commit -m "Fix production logout and demo coach session authority"
          git push origin HEAD:fix/production-logout-and-demo-role
