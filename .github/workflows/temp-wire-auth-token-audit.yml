name: Temporary wire production auth token audit

on:
  push:
    branches:
      - hardening/production-auth-token-redaction

permissions:
  contents: write

jobs:
  update-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/production-auth-token-redaction
      - name: Update production transform auditor
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'scripts/audit-production-transform-chain.mjs';
          let s = fs.readFileSync(p, 'utf8');
          const replacements = [
            [
              "  'scripts/patch-snapshot-cookie-session.mjs',\n  'scripts/patch-coach-link-suite.mjs',",
              "  'scripts/patch-snapshot-cookie-session.mjs',\n  'scripts/patch-production-auth-token-redaction.mjs',\n  'scripts/patch-coach-link-suite.mjs',"
            ],
            [
              "read('tests/snapshot-cookie-session.test.mjs');\nread('tests/coach-link-transaction.test.mjs');",
              "read('tests/snapshot-cookie-session.test.mjs');\nread('tests/production-auth-token-redaction.test.mjs');\nread('tests/coach-link-transaction.test.mjs');"
            ],
            [
              "'ATHLYRAX_PASSWORD_MINIMUM_10','ATHLYRAX_SNAPSHOT_COOKIE_SESSION_V1','ATHLYRAX_STRIPE_WEBHOOK_SIGNATURE_REQUIRED',",
              "'ATHLYRAX_PASSWORD_MINIMUM_10','ATHLYRAX_SNAPSHOT_COOKIE_SESSION_V1','ATHLYRAX_PRODUCTION_AUTH_TOKEN_RESPONSE_REDACTED','ATHLYRAX_STRIPE_WEBHOOK_SIGNATURE_REQUIRED',"
            ],
            [
              "const clientIpPatch = read('scripts/patch-client-ip-integrity.mjs');",
              "const authTokenPatch = read('scripts/patch-production-auth-token-redaction.mjs');\nfor (const token of ['ATHLYRAX_PRODUCTION_AUTH_TOKEN_RESPONSE_REDACTED','...(IS_PRODUCTION ? {} : { token: session.token })','csrfToken: session.csrf','Unconditional bearer token remains in production auth route']) {\n  if (!authTokenPatch.includes(token)) failures.push(`scripts/patch-production-auth-token-redaction.mjs: missing ${token}`);\n}\nif (!transformedIndex.includes('ATHLYRAX_PRODUCTION_AUTH_TOKEN_RESPONSE_REDACTED')) failures.push('index.js: production auth token response redaction marker missing.');\n\nconst clientIpPatch = read('scripts/patch-client-ip-integrity.mjs');"
            ],
            [
              "'test:snapshot-cookie-session','test:storage-routing-safety'",
              "'test:snapshot-cookie-session','test:production-auth-token-redaction','test:storage-routing-safety'"
            ]
          ];
          for (const [a,b] of replacements) {
            if (!s.includes(a)) throw new Error(`audit anchor missing: ${a}`);
            s = s.replace(a,b);
          }
          fs.writeFileSync(p, s);
          NODE
      - name: Commit auditor update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-production-transform-chain.mjs
          git commit -m "audit production auth token redaction transform"
          git push origin HEAD:hardening/production-auth-token-redaction
