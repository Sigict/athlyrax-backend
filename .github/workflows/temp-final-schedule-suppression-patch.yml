name: Temporary backend final Schedule patch

on:
  push:
    branches:
      - fix/schedule-deletion-final
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'fix/schedule-deletion-final' || github.ref == 'refs/heads/fix/schedule-deletion-final' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/schedule-deletion-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/_patch_schedule_suppression_final.mjs
      - name: Commit patched server source
        run: |
          if git diff --quiet -- index.js; then
            echo "No server source patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "Protect legacy Schedule occurrence deletions server-side"
          git push origin HEAD:fix/schedule-deletion-final
