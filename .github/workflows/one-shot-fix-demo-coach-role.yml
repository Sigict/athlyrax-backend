name: One-shot fix demo coach role

on:
  push:
    branches:
      - fix/demo-coach-canonical-role

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/demo-coach-canonical-role
          fetch-depth: 0
      - name: Canonicalize demo coach role and add regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.js')
          s = p.read_text()
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          if old not in s:
              raise SystemExit('canonical tenant login repair block not found exactly')
          p.write_text(s.replace(old, new, 1))
          test = base64.b64decode('')
          Path('tests/demo-coach-canonical-role.test.mjs').write_bytes(test)
          PY
      - name: Verify targeted backend repair
        run: |
          node --check index.js
          node --test tests/demo-coach-canonical-role.test.mjs
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-fix-demo-coach-role.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(auth): restore canonical demo coach role on login'
          git push origin HEAD:fix/demo-coach-canonical-role
