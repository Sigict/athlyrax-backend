name: Temporary wire Stripe processing availability guards

on:
  push:
    branches:
      - hardening/stripe-webhook-processing-availability

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/stripe-webhook-processing-availability
      - name: Wire regression and transform auditor
        run: |
          node <<'NODE'
          const fs = require('fs');

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath,'utf8'));
          pkg.scripts['test:stripe-webhook-processing-availability'] = 'node --test tests/stripe-webhook-processing-availability.test.mjs';
          for (const key of ['verify:closed-pilot-security','test:storage-all']) {
            const needle = 'npm run test:production-auth-token-redaction';
            const addition = `${needle} && npm run test:stripe-webhook-processing-availability`;
            if (!pkg.scripts[key].includes('test:stripe-webhook-processing-availability')) {
              if (!pkg.scripts[key].includes(needle)) throw new Error(`${key} auth-token test anchor missing`);
              pkg.scripts[key] = pkg.scripts[key].replace(needle,addition);
            }
          }
          fs.writeFileSync(packagePath, JSON.stringify(pkg,null,2)+'\n');

          const auditPath = 'scripts/audit-production-transform-chain.mjs';
          let s = fs.readFileSync(auditPath,'utf8');
          const replacements = [
            [
              "  'scripts/patch-stripe-webhook-signature.mjs',\n  'scripts/patch-runtime-identity-event-safety.mjs',",
              "  'scripts/patch-stripe-webhook-signature.mjs',\n  'scripts/patch-stripe-webhook-processing-availability.mjs',\n  'scripts/patch-runtime-identity-event-safety.mjs',"
            ],
            [
              "read('tests/production-auth-token-redaction.test.mjs');\nread('tests/coach-link-transaction.test.mjs');",
              "read('tests/production-auth-token-redaction.test.mjs');\nread('tests/stripe-webhook-processing-availability.test.mjs');\nread('tests/coach-link-transaction.test.mjs');"
            ],
            [
              "'ATHLYRAX_PRODUCTION_AUTH_TOKEN_RESPONSE_REDACTED','ATHLYRAX_STRIPE_WEBHOOK_SIGNATURE_REQUIRED',",
              "'ATHLYRAX_PRODUCTION_AUTH_TOKEN_RESPONSE_REDACTED','ATHLYRAX_STRIPE_WEBHOOK_SIGNATURE_REQUIRED','ATHLYRAX_STRIPE_WEBHOOK_PROCESSING_AVAILABLE',"
            ],
            [
              "if (transformedIndex.includes('if (BILLING_STRIPE_WEBHOOK_SECRET && signature) {')) failures.push('index.js: unsigned Stripe webhook fallback remains.');",
              "if (transformedIndex.includes('if (BILLING_STRIPE_WEBHOOK_SECRET && signature) {')) failures.push('index.js: unsigned Stripe webhook fallback remains.');\n\nconst stripeAvailabilityPatch = read('scripts/patch-stripe-webhook-processing-availability.mjs');\nfor (const token of ['ATHLYRAX_STRIPE_WEBHOOK_PROCESSING_AVAILABLE','Stripe webhook processing is temporarily unavailable.',\"skipped: 'stripe_not_configured'\",'Production Stripe webhook can still acknowledge an unprocessed event.']) {\n  if (!stripeAvailabilityPatch.includes(token)) failures.push(`scripts/patch-stripe-webhook-processing-availability.mjs: missing ${token}`);\n}\nif (!transformedIndex.includes('ATHLYRAX_STRIPE_WEBHOOK_PROCESSING_AVAILABLE')) failures.push('index.js: Stripe webhook processing availability marker missing.');"
            ],
            [
              "'test:snapshot-cookie-session','test:production-auth-token-redaction','test:storage-routing-safety'",
              "'test:snapshot-cookie-session','test:production-auth-token-redaction','test:stripe-webhook-processing-availability','test:storage-routing-safety'"
            ]
          ];
          for (const [from,to] of replacements) {
            if (s.includes(to)) continue;
            if (!s.includes(from)) throw new Error(`audit anchor missing: ${from}`);
            s = s.replace(from,to);
          }
          fs.writeFileSync(auditPath,s);
          NODE
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts/audit-production-transform-chain.mjs
          git commit -m "wire Stripe webhook processing availability guards"
          git push origin HEAD:hardening/stripe-webhook-processing-availability
