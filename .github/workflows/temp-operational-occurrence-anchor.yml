name: Temporary operational occurrence anchor patch

on:
  push:
    branches:
      - fix/schedule-occurrence-server-guard

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/schedule-occurrence-server-guard
          fetch-depth: 0
      - name: Patch operational build anchor
        run: node scripts/_patch-operational-occurrence-anchor.mjs
      - name: Commit build patcher compatibility
        run: |
          if git diff --quiet -- scripts/patch-operational-integrity.mjs; then
            echo "No operational patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/patch-operational-integrity.mjs
          git commit -m "Preserve Schedule resurrection reporting in operational build"
          git push origin HEAD:fix/schedule-occurrence-server-guard
