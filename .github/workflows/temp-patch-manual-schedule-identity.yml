name: Temporary manual Schedule identity patch
on:
  push:
    branches: [fix/schedule-deletion-fail-closed]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/schedule-deletion-fail-closed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/_patch_manual_schedule_identity.mjs
      - run: |
          rm -f scripts/_patch_manual_schedule_identity.mjs
          rm -f .github/workflows/temp-patch-manual-schedule-identity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js scripts/_patch_manual_schedule_identity.mjs .github/workflows/temp-patch-manual-schedule-identity.yml
          git commit -m "Require explicit marker for manual Schedule rows"
          git push origin HEAD:fix/schedule-deletion-fail-closed
