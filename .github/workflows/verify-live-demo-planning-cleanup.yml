name: Verify live demo planning cleanup

on:
  push:
    branches:
      - diagnostic/live-demo-planning-cleanup-verify

permissions:
  contents: read

jobs:
  verify-live-demo-planning-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_URL: https://athlyrax-backend.onrender.com
      DEMO_USERNAME: demo.coach
      DEMO_PASSWORD: DemoCoach123!
    steps:
      - name: Inspect live demo DB shape
        run: |
          set -euo pipefail
          jar="$(mktemp)"
          login="$(mktemp)"
          dbfile="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "${jar}" "${login}" "${dbfile}" "${headers}"' EXIT

          login_code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 30 \
            --cookie-jar "${jar}" --header 'Content-Type: application/json' \
            --data "{\"username\":\"${DEMO_USERNAME}\",\"password\":\"${DEMO_PASSWORD}\"}" \
            --output "${login}" --write-out '%{http_code}' "${BACKEND_URL}/auth/login")"
          test "${login_code}" = "200"

          curl --fail --silent --show-error --location --cookie "${jar}" \
            --dump-header "${headers}" --output "${dbfile}" "${BACKEND_URL}/db?cleanup_inspect=$(date +%s%N)"

          backend_commit="$(awk 'BEGIN{IGNORECASE=1} /^X-AthlyraX-Backend-Commit:/ {gsub(/\r/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "${headers}")"
          revision="$(awk 'BEGIN{IGNORECASE=1} /^X-AthlyraX-DB-Revision:/ {gsub(/\r/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "${headers}")"

          node --input-type=module - "${dbfile}" "${backend_commit}" "${revision}" <<'NODE'
          import fs from 'node:fs';
          const [dbPath, backendCommit, headerRevision] = process.argv.slice(2);
          const db = JSON.parse(fs.readFileSync(dbPath, 'utf8'));
          const asArray = (value) => Array.isArray(value) ? value : [];
          const text = (value) => String(value ?? '').trim();
          const canonicalize = (value) => {
            if (Array.isArray(value)) return value.map(canonicalize);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonicalize(value[key])]));
          };
          const canonicalJson = (value) => JSON.stringify(canonicalize(value));

          const schedule = asArray(db.schedule);
          const legacy = asArray(db.trainingSchedules);
          const scheduleById = new Map(schedule.map((row) => [text(row?.id), row]).filter(([id]) => id));
          const legacyById = new Map(legacy.map((row) => [text(row?.id), row]).filter(([id]) => id));
          const missingInLegacy = [];
          const missingInSchedule = [];
          const contentMismatches = [];
          for (const [id, row] of scheduleById) {
            if (!legacyById.has(id)) missingInLegacy.push(id);
            else if (canonicalJson(row) !== canonicalJson(legacyById.get(id))) contentMismatches.push(id);
          }
          for (const id of legacyById.keys()) if (!scheduleById.has(id)) missingInSchedule.push(id);

          const timetableRows = asArray(db.timetables);
          const timetableLegacy = asArray(db.timetable);
          const keyHistogram = new Map();
          for (const row of timetableRows) {
            const signature = Object.keys(row || {}).sort().join(',');
            keyHistogram.set(signature, (keyHistogram.get(signature) || 0) + 1);
          }
          const timetableShapes = [...keyHistogram.entries()]
            .sort((a, b) => b[1] - a[1])
            .slice(0, 8)
            .map(([keys, count]) => ({ count, keys }));

          const report = {
            tenantId: text(db?.__meta?.tenantId),
            storageRevision: Number(db?.__meta?.storageRevision ?? -1),
            headerRevision: Number(headerRevision || -1),
            backendCommit: text(backendCommit),
            schedule: schedule.length,
            trainingSchedules: legacy.length,
            scheduleUniqueIds: scheduleById.size,
            trainingSchedulesUniqueIds: legacyById.size,
            missingInLegacyCount: missingInLegacy.length,
            missingInScheduleCount: missingInSchedule.length,
            contentMismatchCount: contentMismatches.length,
            firstMismatchId: contentMismatches[0] || '',
            timetable: timetableLegacy.length,
            timetables: timetableRows.length,
            timetableSlots: asArray(db.timetableSlots).length,
            timetableMigrationVersion: Number(db?.__meta?.timetableSlotsLegacyMigrationVersion || 0),
            cleanupAt: text(db?.__meta?.demoPlanningStorageCleanupAt),
            timetableShapes,
            legacyTimetableSampleKeys: Object.keys(timetableLegacy[0] || {}).sort(),
          };
          console.log(JSON.stringify(report, null, 2));
          if (report.tenantId !== 'demo-company') throw new Error(`Unexpected tenant ${report.tenantId}`);
          if (report.headerRevision >= 0 && report.storageRevision !== report.headerRevision) throw new Error('DB revision header/body mismatch.');
          console.log('LIVE_DEMO_PLANNING_INSPECTION_OK');
          NODE
