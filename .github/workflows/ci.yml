name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Reject source-controlled runtime storage
        run: node scripts/verify-repository-runtime-storage.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify closed-pilot security source contract
        run: node verify-closed-pilot-security.mjs
      - name: Guard demo planning cleanup
        run: node --test tests/demo-planning-storage-cleanup.test.mjs
      - name: Full backend storage and security contract
        run: npm run test:storage-all
