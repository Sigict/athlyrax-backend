name: Temporary npm audit details

on:
  push:
    branches:
      - audit/npm-residual-vulnerabilities

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install without application scripts
        run: npm ci --ignore-scripts
      - name: Print npm audit JSON
        run: npm audit --json || true
