<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AthlyraX System Map</title>
<style>
:root { --bg:#0b1220; --panel:#111a2e; --line:#24324f; --text:#e5edf8; --muted:#93a4c0; --accent:#38bdf8; --warn:#fbbf24; --ok:#34d399; }
@media (prefers-color-scheme: light) { :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d6dde8; --text:#0f172a; --muted:#475569; --accent:#0369a1; --warn:#b45309; --ok:#047857; } }
* { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
header { padding:16px; border-bottom:1px solid var(--line); } h1 { margin:0; font-size:20px; } .muted { color:var(--muted); }
nav { display:flex; flex-wrap:wrap; gap:6px; padding:10px 16px; border-bottom:1px solid var(--line); }
nav button, .chip { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:999px; padding:5px 12px; cursor:pointer; font:inherit; }
nav button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
main { display:grid; grid-template-columns:minmax(240px,340px) 1fr; gap:12px; padding:12px 16px; }
@media (max-width: 760px) { main { grid-template-columns:1fr; } }
.list, .detail { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px; min-height:200px; }
.list { max-height:78vh; overflow:auto; } .item { padding:6px 8px; border-radius:8px; cursor:pointer; overflow-wrap:anywhere; } .item:hover, .item.sel { background:color-mix(in srgb, var(--accent) 14%, transparent); }
input[type=search] { width:100%; padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); margin-bottom:6px; }
h2 { font-size:16px; margin:4px 0 8px; } h3 { font-size:13px; margin:12px 0 4px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
code { font-size:12px; overflow-wrap:anywhere; } ul { margin:4px 0; padding-left:18px; } .tag { font-size:11px; border:1px solid var(--line); border-radius:6px; padding:1px 6px; margin-left:4px; color:var(--muted); }
.warn { color:var(--warn); } .ok { color:var(--ok); } a.link { color:var(--accent); cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<header>
  <h1>AthlyraX System Map <span class="tag">owner only · read-only</span></h1>
  <div class="muted" id="meta">Loading…</div>
</header>
<nav aria-label="Views">
  <button type="button" data-view="apps" aria-pressed="true">Applications</button>
  <button type="button" data-view="collections" aria-pressed="false">Data (tables)</button>
  <button type="button" data-view="routes" aria-pressed="false">Server routes &amp; permissions</button>
  <button type="button" data-view="relationships" aria-pressed="false">Relationships</button>
  <button type="button" data-view="integrations" aria-pressed="false">External integrations</button>
  <button type="button" data-view="storage" aria-pressed="false">Storage</button>
</nav>
<main>
  <section class="list" aria-label="Items"><input type="search" id="q" placeholder="Filter…" aria-label="Filter"><div id="items"></div></section>
  <section class="detail" aria-live="polite" id="detail"><p class="muted">Select an item to see what it does and how it connects.</p></section>
</main>
<script src="system-map/app.js"></script>
</body>
</html>
