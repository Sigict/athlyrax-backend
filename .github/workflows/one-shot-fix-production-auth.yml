name: One-shot fix production auth

on:
  push:
    branches:
      - fix/production-logout-and-demo-role

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-logout-and-demo-role
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply production auth patch
        run: node scripts/one-shot-patch-production-auth.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify production auth session
        run: npm run test:production-auth-session
      - name: Verify complete storage and security suite
        run: npm run test:storage-all
      - name: Commit verified repair
        shell: bash
        run: |
          rm .github/workflows/one-shot-fix-production-auth.yml
          rm scripts/one-shot-patch-production-auth.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix production logout and demo coach session authority"
          git push origin HEAD:fix/production-logout-and-demo-role
